<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NMDA Sales Assistant</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div>
    <p class="eyebrow">NMDA EVENTS</p>
    <h1>Sales Assistant</h1>
    <p class="subtitle">Sales outreach</p>
  </div>
  <div class="topbarActions">
    <a id="openCrm" class="crmHomeLink" href="#" target="_blank" rel="noopener noreferrer" hidden>Open CRM ↗</a>
    <div id="connection" class="connection">Connecting…</div>
  </div>
</header>

<main>
  <section class="summary">
    <article><strong id="countDue">—</strong><span>Actions due today</span></article>
    <article><strong id="countF1">—</strong><span>Follow-up #1</span></article>
    <article><strong id="countF2">—</strong><span>Follow-up #2</span></article>
    <article><strong id="countRecycle">—</strong><span>Ready to recycle</span></article>
    <article><strong id="countReplies">—</strong><span>Replies to review</span></article>
  </section>

  <section class="toolbar">
    <input id="search" type="search" placeholder="Search leads or email…">
    <select id="filter">
      <option value="ALL">All actions</option>
      <option value="DUE">Due today</option>
      <option value="FIRST_EMAIL">First Email</option>
      <option value="FOLLOW_UP_1">Follow-up #1</option>
      <option value="FOLLOW_UP_2">Follow-up #2</option>
      <option value="RECYCLE">Recycled</option>
      <option value="REVIEW_RESPONSE">Replies</option>
    </select>
    <button id="refresh">Refresh</button>
  </section>

  <section class="panel">
    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th>Lead</th>
            <th>Status</th>
            <th>Contact</th>
            <th>Emails</th>
            <th>Last contact</th>
            <th>Next action</th>
            <th>Date</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="leadRows">
          <tr><td colspan="8" class="loading">Loading leads from EspoCRM…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<dialog id="detailDialog">
  <button class="dialogClose" id="dialogClose" aria-label="Close">×</button>
  <div id="detailContent"></div>
</dialog>

<script src="/app.js"></script>
</body>
</html>
