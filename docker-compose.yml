services:
  nmda-crm-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nmda-crm-assistant
    restart: unless-stopped

    ports:
      - "8090:8090"

    env_file:
      - .env

    environment:
      ESPOCRM_URL: http://host.docker.internal:8080
      OLLAMA_URL: http://host.docker.internal:11434

    extra_hosts:
      - "host.docker.internal:host-gateway"
